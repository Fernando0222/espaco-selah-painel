{% extends "base.html" %}
{% block title %}Excluir data{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-eyebrow">Agenda</div>
    <h1 class="page-title">Excluir data</h1>
  </div>
</div>

<div class="card" style="max-width:480px;">
  <p>Tem certeza que deseja excluir a data <strong>{{ object.date|date:"d/m/Y" }}</strong> ({{ object.get_status_display }})?</p>
  <form method="post" style="margin-top:20px; display:flex; gap:10px;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a href="{% url 'bookings:calendar' %}" class="btn btn-outline">Cancelar</a>
  </form>
</div>
{% endblock %}
