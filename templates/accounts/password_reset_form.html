{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar senha · Espaço Selah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Espaço <span>Selah</span></div>
    <div class="auth-subtitle">Recuperar acesso</div>

    <p style="font-size:0.85rem; color:var(--brown); margin-bottom:22px;">
      Informe o e-mail cadastrado na sua conta. Vamos enviar um link para você criar uma nova senha.
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="{{ form.email.id_for_label }}">E-mail</label>
        {{ form.email }}
        {% for error in form.email.errors %}<div class="form-errors">{{ error }}</div>{% endfor %}
      </div>
      <button type="submit" class="btn btn-primary">Enviar link de recuperação</button>
    </form>

    <div style="text-align:center; margin-top:18px;">
      <a href="{% url 'accounts:login' %}" style="font-size:0.8rem; color:var(--brown);">Voltar para o login</a>
    </div>
  </div>
</div>
</body>
</html>
