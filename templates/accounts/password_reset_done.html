{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar senha · Espaço Selah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Espaço <span>Selah</span></div>
    <div class="auth-subtitle">Verifique seu e-mail</div>

    <p style="font-size:0.85rem; color:var(--brown); line-height:1.7;">
      Se o e-mail informado estiver cadastrado, você vai receber uma mensagem com um link para criar uma nova senha. O link é válido por alguns dias.
    </p>

    <div style="text-align:center; margin-top:18px;">
      <a href="{% url 'accounts:login' %}" class="btn btn-outline" style="width:100%; justify-content:center;">Voltar para o login</a>
    </div>
  </div>
</div>
</body>
</html>
